<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SuperAdmin RservasRoma</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <!-- Estilos ya generados (tools/tailwind/tailwind.config.js): el CDN de Tailwind
         bajaba un compilador y generaba los estilos en el telefono en cada apertura. -->
    <link rel="stylesheet" href="vendor/tailwind.css?v=20261007-cumple1">
    <!-- Version fija y con integrity: este panel puede borrar salones, no debe cargar
         codigo que cambie solo. Para actualizar: nueva version + nuevo hash sha384. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
    <style>
        /* Lo que dibuja el navegador tambien lleva la paleta del panel. */
        :root { color-scheme: light; accent-color: #6d28d9; }
        ::selection { background: #ede9fe; color: #3b0764; }
        a, button, summary, input, select, textarea { -webkit-tap-highlight-color: transparent; }
        :focus-visible { outline: 2px solid #7c3aed; outline-offset: 2px; }
        html { scroll-padding-top: 1rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
    <div id="panel-header"></div>
    <div id="lista-negocios"></div>
    
    <!-- Misma build de bcryptjs que usa admin-login.html para VERIFICAR el hash.
         Si aqui se usara otra version, podrian generarse hashes que el login no
         sabe comprobar y el salon quedaria fuera de su propio panel. -->
    <script src="vendor/bcrypt.min.js?v=20260809-cambiar-clave"></script>
    <script src="supabase-config.js?v=20260927-seguridad1"></script>
    <script src="commercial-tracking.js?v=20261007-cumple1"></script>
    <script src="super-admin.js?v=20261007-cumple1"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('✅ Service Worker registrado');
            }).catch(err => {
                console.log('❌ Error SW:', err);
            });
        }
    </script>
</body>
</html>
