<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Super Admin - Rservas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .menu-transition {
            transition: all 0.2s ease;
        }
        .reservas-diarias-number {
            transition: all 0.3s ease;
        }
        .order-btn.active {
            background-color: #7c3aed;
            color: white;
        }
        .order-btn.active:hover {
            background-color: #6d28d9;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="panel-header"></div>
    <div id="lista-negocios"></div>
    
    <script src="supabase-config.js?v=20260620-nube-v1"></script>
    <script src="super-admin.js?v=20260719-limpieza"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('✅ Service Worker registrado');
            }).catch(err => {
                console.log('❌ Error SW:', err);
            });
        }
    </script>
</body>
</html>
