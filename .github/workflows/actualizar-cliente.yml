name: Actualizar cliente desde Exotic

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repo del cliente (ej. dnailspassion)
        required: true
        type: string
      con_apk:
        description: Tambien construir APK Android
        required: false
        default: 'false'
        type: string

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar SuperAdmin
        uses: actions/checkout@v4
        with:
          path: superadmin

      - name: Verificar repo cliente
        id: find-repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SLUG="${{ inputs.repo }}"
          OWNER="tusalon"
          # Probar el slug exacto y variaciones comunes
          for CANDIDATE in "$SLUG" "${SLUG}-" "-${SLUG}" "${SLUG}_"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$OWNER/$CANDIDATE")
            if [ "$STATUS" = "200" ]; then
              echo "repo=$CANDIDATE" >> "$GITHUB_OUTPUT"
              echo "Repo encontrado: $CANDIDATE"
              exit 0
            fi
          done
          echo "No se encontro repo para slug: $SLUG"
          exit 1

      - name: Clonar exoticnailsbyyuly (fuente)
        uses: actions/checkout@v4
        with:
          repository: tusalon/exoticnailsbyyuly
          token: ${{ secrets.GH_TOKEN }}
          path: fuente

      - name: Clonar cliente (destino)
        uses: actions/checkout@v4
        with:
          repository: tusalon/${{ steps.find-repo.outputs.repo }}
          token: ${{ secrets.GH_TOKEN }}
          path: cliente

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar archivos desde Exotic
        run: |
          node superadmin/tools/update-client-from-exotic.js \
            --base ./fuente \
            --target ./cliente \
            --apply

      - name: Marcar version
        run: |
          node superadmin/tools/mark-client-version.js \
            --target ./cliente \
            --apply

      - name: Commit y push
        run: |
          cd cliente
          git config user.name "RservasRoma Bot"
          git config user.email "rservasroma@gmail.com"
          git add -A
          git restore --staged android/ 2>/dev/null || true
          git restore --staged "supabase/.temp/" 2>/dev/null || true
          if [ "${{ inputs.con_apk }}" = "true" ]; then
            MSG="Actualizar logica de reservas"
          else
            MSG="Actualizar logica de reservas [skip actions]"
          fi
          git diff --cached --quiet || git commit -m "$MSG"
          git push
