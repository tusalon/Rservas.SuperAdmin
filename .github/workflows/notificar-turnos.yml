name: Notificar turnos por NTFY

on:
  schedule:
    # GitHub Actions usa UTC.
    # Cuba UTC-4 (verano): 7:00 AM = 11:00 UTC | 9:00 PM = 01:00 UTC
    - cron: '0 11 * * *'
    - cron: '0 1 * * *'
    # Cuba UTC-5 (invierno): 7:00 AM = 12:00 UTC | 9:00 PM = 02:00 UTC
    - cron: '0 12 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Dia a notificar
        required: true
        default: tomorrow
        type: choice
        options:
          - today
          - tomorrow

jobs:
  notificar-turnos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Definir envio automatico
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          event_schedule="${{ github.event.schedule }}"
          cuba_offset="$(TZ=America/Havana date +%z)"

          echo "Schedule recibido: $event_schedule"
          echo "Offset Cuba actual: $cuba_offset"

          # 7 AM Cuba -> turnos de hoy
          if { [ "$cuba_offset" = "-0400" ] && [ "$event_schedule" = "0 11 * * *" ]; } || \
             { [ "$cuba_offset" = "-0500" ] && [ "$event_schedule" = "0 12 * * *" ]; }; then
            echo "value=today" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          # 9 PM Cuba -> turnos de manana
          elif { [ "$cuba_offset" = "-0400" ] && [ "$event_schedule" = "0 1 * * *" ]; } || \
               { [ "$cuba_offset" = "-0500" ] && [ "$event_schedule" = "0 2 * * *" ]; }; then
            echo "value=tomorrow" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=skip" >> "$GITHUB_OUTPUT"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar notificaciones
        if: steps.target.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NTFY_TOPIC_GLOBAL: ${{ secrets.NTFY_TOPIC_GLOBAL }}
        run: node tools/notificar-turnos.js --target "${{ steps.target.outputs.value }}"

      - name: Saltar fuera de horario
        if: steps.target.outputs.should_run != 'true'
        run: echo "No es hora de notificar en Cuba."
